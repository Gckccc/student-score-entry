<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生积分</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { font-size: 60px; margin-bottom: 10px; }
        h2 { color: #333; margin: 0 0 10px 0; }
        p { color: #999; margin: 0 0 20px 0; font-size: 14px; }
        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; }
        #status { margin-top: 15px; font-size: 14px; min-height: 20px; }
        .user-box { display: none; }
        .enter-btn {
            display: block;
            padding: 15px;
            font-size: 16px;
            color: white;
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            border-radius: 10px;
            text-decoration: none;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .logout-btn {
            padding: 10px;
            font-size: 14px;
            color: #999;
            background: none;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="inputBox">
            <div class="logo">🌸</div>
            <h2>学生积分管理系统</h2>
            <p>请输入激活码</p>
            <input type="text" id="code" placeholder="SCOR-XXXX-XXXX-XXXX" maxlength="19">
            <button id="btn" onclick="doActivate()">🔓 激活</button>
            <div id="status"></div>
        </div>
        
        <div id="userBox" class="user-box">
            <div class="logo">👤</div>
            <h2 id="userName">用户</h2>
            <p id="userExpire">永久有效</p>
            <a id="enterBtn" class="enter-btn" href="#">🚀 进入系统</a>
            <button class="logout-btn" onclick="doLogout()">切换账号</button>
        </div>
    </div>
    
    <script>
        var API = 'https://api.github.com/gists/276490742b7a690ffb0a035ac4d6fd3b';
        var KEY = 'student_score_v2';
        
        // 页面加载
        window.onload = function() {
            console.log('页面加载');
            
            // 检查已保存的激活信息
            var saved = localStorage.getItem(KEY);
            if (saved) {
                try {
                    var data = JSON.parse(saved);
                    if (data.user && data.code) {
                        // 检查过期
                        if (data.expire && data.expire !== '永久') {
                            var expireDate = new Date(data.expire);
                            if (new Date() <= expireDate) {
                                showUser(data);
                                return;
                            }
                        } else {
                            showUser(data);
                            return;
                        }
                    }
                } catch(e) {
                    console.log('解析失败');
                }
                localStorage.removeItem(KEY);
            }
            
            // 显示激活界面
            showInput();
        };
        
        function showInput() {
            document.getElementById('inputBox').style.display = 'block';
            document.getElementById('userBox').style.display = 'none';
            document.getElementById('btn').disabled = false;
            document.getElementById('code').value = '';
            document.getElementById('status').textContent = '';
        }
        
        function showUser(data) {
            document.getElementById('inputBox').style.display = 'none';
            document.getElementById('userBox').style.display = 'block';
            document.getElementById('userName').textContent = data.user;
            document.getElementById('userExpire').textContent = 
                data.expire === '永久' ? '永久有效' : '有效期至：' + data.expire;
            
            // 设置进入按钮
            document.getElementById('enterBtn').onclick = function(e) {
                e.preventDefault();
                enterSystem(data.code);
            };
        }
        
        function doActivate() {
            var code = document.getElementById('code').value.trim().toUpperCase();
            var status = document.getElementById('status');
            var btn = document.getElementById('btn');
            
            if (!code) {
                status.textContent = '❌ 请输入激活码';
                status.style.color = '#f44336';
                return;
            }
            
            btn.disabled = true;
            status.textContent = '⏳ 正在验证...';
            status.style.color = '#ff9800';
            
            fetch(API + '?t=' + Date.now())
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!data.files || !data.files['codes.json']) {
                        throw new Error('数据异常');
                    }
                    
                    var codes = JSON.parse(data.files['codes.json'].content);
                    
                    if (!codes[code]) {
                        status.textContent = '❌ 激活码无效';
                        status.style.color = '#f44336';
                        btn.disabled = false;
                        return;
                    }
                    
                    var info = codes[code];
                    
                    if (!info.enabled) {
                        status.textContent = '❌ 激活码已被禁用';
                        status.style.color = '#f44336';
                        btn.disabled = false;
                        return;
                    }
                    
                    if (info.expire && info.expire !== '永久') {
                        var expireDate = new Date(info.expire);
                        if (new Date() > expireDate) {
                            status.textContent = '❌ 激活码已过期';
                            status.style.color = '#f44336';
                            btn.disabled = false;
                            return;
                        }
                    }
                    
                    // 保存激活信息
                    var saveData = {
                        code: code,
                        user: info.user,
                        expire: info.expire
                    };
                    
                    localStorage.setItem(KEY, JSON.stringify(saveData));
                    
                    status.textContent = '✅ 激活成功！';
                    status.style.color = '#4caf50';
                    
                    setTimeout(function() {
                        showUser(saveData);
                    }, 800);
                })
                .catch(function(e) {
                    console.error(e);
                    status.textContent = '❌ 网络错误，请重试';
                    status.style.color = '#f44336';
                    btn.disabled = false;
                });
        }
        
        function enterSystem(code) {
            var status = document.getElementById('status');
            document.getElementById('userBox').style.display = 'block';
            
            // 直接跳转到学生积分页面（不再通过Gist获取地址）
            fetch(API + '?t=' + Date.now())
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var codes = JSON.parse(data.files['codes.json'].content);
                    var info = codes[code];
                    
                    if (!info || !info.current_url) {
                        alert('⚠️ 电脑端程序未启动，请先打开电脑上的程序');
                        return;
                    }
                    
                    // 跳转
                    window.location.href = info.current_url;
                })
                .catch(function(e) {
                    alert('❌ 网络错误');
                });
        }
        
        function doLogout() {
            if (confirm('确定要切换账号吗？')) {
                localStorage.removeItem(KEY);
                showInput();
            }
        }
    </script>
</body>
</html>
