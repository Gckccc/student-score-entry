<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="学生积分">
    <meta name="theme-color" content="#667eea">
    <title>🌸 学生积分</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .logo { font-size: 64px; margin-bottom: 10px; }
        
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .code-input {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 2px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .code-input:focus { border-color: #667eea; }
        
        .activate-btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .activate-btn:active { transform: scale(0.98); }
        .activate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .status {
            margin-top: 20px;
            font-size: 14px;
            min-height: 20px;
        }
        
        .status.error { color: #f44336; }
        .status.success { color: #4caf50; }
        .status.loading { color: #ff9800; }
        
        .loading-container { display: none; }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .user-info { display: none; }
        
        .user-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            color: white;
        }
        
        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .user-expire {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }
        
        .enter-btn {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            text-decoration: none;
            text-align: center;
        }
        
        .enter-btn:active { transform: scale(0.98); }
        
        .logout-btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            color: #999;
            background: none;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .tips {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
            text-align: left;
        }
        
        .tips-title { font-weight: bold; margin-bottom: 5px; color: #333; }
        
        .hidden { display: none !important; }
        
        .manual-enter {
            display: none;
        }
        
        .manual-enter-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 输入激活码界面 -->
        <div id="inputPage">
            <div class="logo">🌸</div>
            <div class="title">学生积分管理系统</div>
            <div class="subtitle">请输入激活码以继续</div>
            
            <div class="input-group">
                <input type="text" 
                       id="codeInput" 
                       class="code-input" 
                       placeholder="SCOR-XXXX-XXXX-XXXX"
                       maxlength="19"
                       autocapitalize="characters"
                       autocomplete="off"
                       spellcheck="false">
            </div>
            
            <button class="activate-btn" id="activateBtn" onclick="activate()">
                🔓 激活
            </button>
            
            <div class="status" id="status"></div>
            
            <div class="tips">
                <div class="tips-title">💡 小提示</div>
                激活后可以点击浏览器菜单中的"添加到主屏幕"，下次就可以像APP一样直接打开了。
            </div>
        </div>
        
        <!-- 加载界面 -->
        <div id="loadingPage" class="loading-container">
            <div class="spinner"></div>
            <div class="title">正在连接...</div>
            <div class="subtitle" id="loadingText">请稍候</div>
        </div>
        
        <!-- 用户信息界面 -->
        <div id="userPage" class="user-info">
            <div class="user-avatar">👤</div>
            <div class="user-name" id="userName">用户</div>
            <div class="user-expire" id="userExpire">有效期至：永久</div>
            
            <button class="enter-btn" onclick="enterApp()">
                🚀 进入系统
            </button>
            
            <button class="logout-btn" onclick="logout()">
                切换账号
            </button>
        </div>
        
        <!-- 手动跳转界面（APP兼容模式） -->
        <div id="jumpPage" class="manual-enter">
            <div class="logo">✅</div>
            <div class="title">服务器已连接</div>
            <div class="subtitle">点击下方按钮进入系统</div>
            
            <a id="jumpBtn" class="manual-enter-btn" href="#" target="_top">
                🚀 进入系统
            </a>
            
            <div class="tips" style="margin-top:30px;">
                <div class="tips-title">💡 提示</div>
                如果点击后没有反应，请检查电脑端程序是否启动。
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.github.com/gists/276490742b7a690ffb0a035ac4d6fd3b';
        const STORAGE_KEY = 'student_score_activation';
        
        window.addEventListener('load', () => {
            checkSavedActivation();
            const input = document.getElementById('codeInput');
            input.addEventListener('input', formatInput);
        });
        
        function formatInput(e) {
            let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            
            if (value.startsWith('SCOR')) {
                value = value.substring(0, 16);
                let formatted = value.substring(0, 4);
                for (let i = 4; i < value.length; i += 4) {
                    formatted += '-' + value.substring(i, i + 4);
                }
                e.target.value = formatted;
            } else {
                value = value.substring(0, 16);
                let formatted = '';
                for (let i = 0; i < value.length; i += 4) {
                    if (i > 0) formatted += '-';
                    formatted += value.substring(i, i + 4);
                }
                e.target.value = formatted;
            }
        }
        
        function checkSavedActivation() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.expire && data.expire !== '永久') {
                        const expireDate = new Date(data.expire);
                        if (new Date() > expireDate) {
                            localStorage.removeItem(STORAGE_KEY);
                            showInputPage();
                            setStatus('激活码已过期，请重新输入', 'error');
                            return;
                        }
                    }
                    showUserPage(data);
                } catch (e) {
                    localStorage.removeItem(STORAGE_KEY);
                    showInputPage();
                }
            }
        }
        
        async function activate() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            
            if (!code) {
                setStatus('❌ 请输入激活码', 'error');
                return;
            }
            
            document.getElementById('activateBtn').disabled = true;
            setStatus('⏳ 正在验证...', 'loading');
            
            try {
                const res = await fetch(API_URL + '?t=' + Date.now());
                const data = await res.json();
                
                if (!data.files || !data.files['codes.json']) {
                    setStatus('❌ 激活码系统异常', 'error');
                    document.getElementById('activateBtn').disabled = false;
                    return;
                }
                
                const codes = JSON.parse(data.files['codes.json'].content);
                
                if (!codes[code]) {
                    setStatus('❌ 激活码无效', 'error');
                    document.getElementById('activateBtn').disabled = false;
                    return;
                }
                
                const info = codes[code];
                
                if (!info.enabled) {
                    setStatus('❌ 激活码已被禁用', 'error');
                    document.getElementById('activateBtn').disabled = false;
                    return;
                }
                
                if (info.expire && info.expire !== '永久') {
                    const expireDate = new Date(info.expire);
                    if (new Date() > expireDate) {
                        setStatus('❌ 激活码已过期', 'error');
                        document.getElementById('activateBtn').disabled = false;
                        return;
                    }
                }
                
                const activationData = {
                    code: code,
                    user: info.user,
                    expire: info.expire,
                    entry_id: info.entry_id,
                    activated_at: new Date().toISOString()
                };
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify(activationData));
                
                setStatus('✅ 激活成功！', 'success');
                
                setTimeout(() => {
                    showUserPage(activationData);
                }, 800);
                
            } catch (e) {
                console.error(e);
                setStatus('❌ 网络错误，请重试', 'error');
                document.getElementById('activateBtn').disabled = false;
            }
        }
        
        async function enterApp() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                showInputPage();
                return;
            }
            
            const data = JSON.parse(saved);
            
            showLoadingPage('正在获取服务器地址...');
            
            try {
                const res = await fetch(API_URL + '?t=' + Date.now());
                const gistData = await res.json();
                const codes = JSON.parse(gistData.files['codes.json'].content);
                
                const info = codes[data.code];
                
                if (!info) {
                    showInputPage();
                    setStatus('❌ 激活码已被删除', 'error');
                    return;
                }
                
                if (!info.enabled) {
                    showInputPage();
                    setStatus('❌ 激活码已被禁用', 'error');
                    return;
                }
                
                if (!info.current_url) {
                    showInputPage();
                    setStatus('⚠️ 电脑端程序未启动，请先打开电脑上的程序', 'error');
                    return;
                }
                
                document.getElementById('loadingText').textContent = '正在跳转...';
                
                // 方式1：先尝试直接跳转
                const targetUrl = info.current_url;
                
                // 延迟一下让用户看到loading
                setTimeout(() => {
                    // 判断是否在iframe中（APP环境）
                    const isInIframe = (window.top && window.top !== window.self);
                    
                    if (isInIframe) {
                        // APP环境：显示手动跳转按钮
                        showJumpPage(targetUrl, data);
                    } else {
                        // 浏览器环境：直接跳转
                        window.location.href = targetUrl;
                    }
                }, 500);
                
            } catch (e) {
                console.error(e);
                showInputPage();
                setStatus('❌ 连接失败，请重试', 'error');
            }
        }
        
        function showJumpPage(url, userData) {
            document.getElementById('inputPage').classList.add('hidden');
            document.getElementById('loadingPage').classList.add('hidden');
            document.getElementById('userPage').classList.add('hidden');
            document.getElementById('jumpPage').classList.remove('hidden');
            
            document.getElementById('jumpBtn').href = url;
            
            // 3秒后自动尝试跳转
            setTimeout(() => {
                try {
                    window.top.location.href = url;
                } catch(e) {
                    // 跨域，无法自动跳转
                }
            }, 1000);
        }
        
        function logout() {
            if (confirm('确定要切换账号吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                document.getElementById('codeInput').value = '';
                showInputPage();
                setStatus('', '');
            }
        }
        
        function showInputPage() {
            document.getElementById('inputPage').classList.remove('hidden');
            document.getElementById('loadingPage').classList.add('hidden');
            document.getElementById('userPage').classList.add('hidden');
            document.getElementById('jumpPage').classList.add('hidden');
            document.getElementById('activateBtn').disabled = false;
        }
        
        function showLoadingPage(text) {
            document.getElementById('inputPage').classList.add('hidden');
            document.getElementById('loadingPage').classList.remove('hidden');
            document.getElementById('userPage').classList.add('hidden');
            document.getElementById('jumpPage').classList.add('hidden');
            if (text) {
                document.getElementById('loadingText').textContent = text;
            }
        }
        
        function showUserPage(data) {
            document.getElementById('inputPage').classList.add('hidden');
            document.getElementById('loadingPage').classList.add('hidden');
            document.getElementById('userPage').classList.remove('hidden');
            document.getElementById('jumpPage').classList.add('hidden');
            
            document.getElementById('userName').textContent = data.user;
            
            const expireText = data.expire === '永久' ? '永久有效' : `有效期至：${data.expire}`;
            document.getElementById('userExpire').textContent = expireText;
        }
        
        function setStatus(text, type) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = 'status ' + (type || '');
        }
    </script>
</body>
</html>
